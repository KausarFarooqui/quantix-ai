name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint-and-test:
    name: API — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantix
          POSTGRES_PASSWORD: quantix_test_password
          POSTGRES_DB: quantix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key
          POSTGRES_HOST: localhost
          POSTGRES_USER: quantix
          POSTGRES_PASSWORD: quantix_test_password
          POSTGRES_DB: quantix_test
          REDIS_HOST: localhost
        run: uv run pytest --cov-fail-under=90

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: api
          fail_ci_if_error: false

  web-lint-and-test:
    name: Web — lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit/component tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  docker-build:
    name: Docker build sanity check
    runs-on: ubuntu-latest
    needs: [api-lint-and-test, web-lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: quantix-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: quantix-web:ci
