[project]
name = "quantix-api"
version = "0.1.0"
description = "Quantix AI backend API — FastAPI service implementing Clean Architecture."
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "redis>=5.2.0,<6.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "structlog>=24.4.0,<25.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "httpx>=0.27.2,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "duckdb>=1.1.3,<2.0.0",
    "orjson>=3.10.10,<4.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "cryptography>=43.0.3,<44.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pyarrow>=18.0.0,<19.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "pymssql>=2.3.2,<3.0.0",
    "snowflake-sqlalchemy>=1.7.1,<2.0.0",
    "google-cloud-bigquery>=3.27.0,<4.0.0",
    "db-dtypes>=1.3.0,<2.0.0",
    "google-api-python-client>=2.154.0,<3.0.0",
    "google-auth>=2.36.0,<3.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "langgraph>=0.2.60,<0.3.0",
    "scikit-learn>=1.5.2,<2.0.0",
    "statsmodels>=0.14.2,<0.15.0",
    "numpy>=2.1.3,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.2,<1.0.0",
    "ruff>=0.7.4,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "faker>=33.0.0,<34.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantix_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=quantix_api --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
env = [
    "ENVIRONMENT=test",
]

[tool.coverage.run]
source = ["src/quantix_api"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "N", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
